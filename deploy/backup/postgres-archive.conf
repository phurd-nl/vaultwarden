# =============================================================================
# postgres-archive.conf — WAL archiving settings for Point-In-Time Recovery.
#
# NIST 800-53B Moderate: CP-9 (incremental/continuous backup via WAL),
# CP-10 (PITR enables recovery to a chosen point, e.g. just before a bad
# delete), SC-28 (the WAL archive volume must be on encrypted-at-rest storage,
# same MP/SC requirement as vw-pgdata — see deploy/README.md).
#
# HOW THIS IS APPLIED
#   PostgreSQL in this deployment is configured entirely via the container
#   Exec= line (see deploy/quadlet/vw-postgres.container), NOT via a mounted
#   postgresql.conf. So these settings are DOCUMENTED here for review and are
#   added as `-c key=value` flags to the Exec line. The exact lines to add are
#   in deploy/backup/README.md ("Enabling PITR — quadlet edit").
#
#   You also need a dedicated, WRITABLE WAL-archive volume mounted into the
#   postgres container (the rootfs is ReadOnly=true). That volume is what
#   basebackup.sh and any PITR restore consume. README documents the new
#   vw-pgwal volume + mount line.
#
# WAL RETENTION / OFFSITE
#   The archive_command below copies each completed WAL segment into the
#   archive dir. You MUST ship that archive dir offsite (MP-5) alongside the
#   periodic base backups from basebackup.sh, and prune it only after a newer
#   base backup exists — otherwise PITR coverage has gaps.
# =============================================================================

# Turn on continuous WAL archiving. Requires a restart (archive_mode is not
# reloadable). wal_level=replica is the default in PG 17 and is sufficient.
archive_mode = on
wal_level = replica

# Archive each completed segment into the mounted WAL-archive volume.
#   %p = path to the segment to archive (relative to the data dir)
#   %f = just the file name
# The command MUST return non-zero if the file already exists (test ! -f) so
# Postgres never silently overwrites an archived segment, and MUST fsync via
# cp so a crash can't lose an "archived" segment. Adjust /var/lib/postgresql/wal-archive
# to wherever you mount the WAL-archive volume in the container.
archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'

# Force a WAL switch at least this often so PITR granularity (RPO) is bounded
# even on a quiet system: an idle DB still archives a segment every 5 minutes.
archive_timeout = 300

# Keep enough WAL around for an in-progress base backup to complete even under
# write load. (Tune for your write volume; 1GB is ample for a small instance.)
max_wal_size = 1GB
min_wal_size = 80MB

# Audit-relevant: log checkpoints so archive/recovery activity is traceable (AU).
log_checkpoints = on
