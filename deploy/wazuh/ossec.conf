<!--
  Wazuh agent configuration for the hardened Vaultwarden stack.
  NIST SP 800-53B Moderate: AU-2/AU-3 (what we collect), AU-6 (forward for
  review), SI-4 (monitoring), IR-4 (alerts feed incident handling).

  Log source strategy: the app/caddy/postgres containers run with
  LogDriver=journald (see README.md "Log path strategy"). This agent reads the
  host journal and filters by CONTAINER_NAME. The three relevant streams:

    * nextvault          -> stdout carries the nextvault::audit JSON lines
    * nextvault-caddy           -> stdout carries Caddy's JSON access/error log
    * nextvault-postgres        -> stdout carries Postgres' text log (FATAL/auth lines)

  Custom decoders/rules that parse these live in local_decoder.xml /
  local_rules.xml and are deployed to the manager (see README.md).
-->
<ossec_config>

  <!-- ================= Vaultwarden application audit JSON ================= -->
  <!-- The fork emits one JSON object per security event on the
       nextvault::audit target (fields: ts, event_type, event_name,
       user_uuid, act_user_uuid, org_uuid, cipher_uuid, device_type, ip).
       The JSON decoder turns each field into a decoded key the rules match on.
       We read journald and keep only the nextvault container's stream. -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
    <filter field="CONTAINER_NAME">^nextvault$</filter>
  </localfile>

  <!-- ===================== Caddy JSON access/error log ==================== -->
  <!-- Caddyfile sets `log { output stdout; format json }`. Caddy access logs
       are JSON with request.uri, status, request.remote_ip, etc. Used to alert
       on /admin access attempts at the proxy layer (defense in depth alongside
       the app's admin.login.* audit events). -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
    <filter field="CONTAINER_NAME">^nextvault-caddy$</filter>
  </localfile>

  <!-- ========================= PostgreSQL logs =========================== -->
  <!-- Postgres logs are line-oriented text (log_line_prefix '%m [%p] %q%u@%d
       %r '). We need the "FATAL ... password authentication failed" lines for
       DB auth-failure alerting (NIST AC-7/AU-6). Wazuh's built-in postgresql
       decoders handle the common cases; local_rules.xml adds the FATAL match. -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
    <filter field="CONTAINER_NAME">^nextvault-postgres$</filter>
  </localfile>

  <!-- ===================== Agent <-> manager transport =================== -->
  <!-- Where alerts go. WAZUH_MANAGER (wazuh-agent.env) is substituted into
       <address> at enrollment by the image entrypoint. TCP is used so events
       are not silently dropped under load (AU-5). -->
  <client>
    <server>
      <address>MANAGER_ADDRESS</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <!-- Auto-enrollment: the entrypoint injects the manager + shared key from
         the env/secret. enabled here so a fresh agent self-registers. -->
    <enrollment>
      <enabled>yes</enabled>
      <agent_name>AGENT_NAME</agent_name>
      <groups>nextvault</groups>
    </enrollment>
    <notify_time>30</notify_time>
    <time-reconnect>120</time-reconnect>
  </client>

  <!-- Buffer events locally if the manager is briefly unreachable (AU-5). -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Lightweight self-integrity of the agent's own config dir (SI-7). The app
       containers are immutable (ReadOnly=true), so FIM here just watches the
       agent's rule/decoder/config surface for tampering. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <directories check_all="yes" realtime="yes">/var/ossec/etc</directories>
  </syscheck>

  <!-- Rootcheck/SCA off by default in this sidecar — the host is hardened and
       scanned elsewhere; this agent's job is log shipping (AU-6), not host CIS. -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <!-- Forward the agent's own logs so collection failures are visible (AU-5). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/ossec.log</location>
  </localfile>

</ossec_config>
