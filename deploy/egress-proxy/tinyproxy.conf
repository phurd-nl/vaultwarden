# tinyproxy — egress allowlist proxy for Vaultwarden -> Microsoft Entra (OIDC).
# Default-deny forward proxy: only TLS CONNECT tunnels to the allowlisted Entra
# hosts (see ./filter) on port 443 are permitted. TLS is end-to-end; this proxy
# only tunnels, it does not terminate or inspect TLS.

# No User/Group drop: under rootless podman with DropCapability=ALL the container
# runs as an already-unprivileged, userns-mapped host UID, and tinyproxy lacks
# CAP_SETUID/SETGID to drop further (it would fail with "Unable to change to
# group"). Privilege separation is provided by the user namespace, not setuid.
#User tinyproxy
#Group tinyproxy

# Listen on the proxy port. Only reachable on the internal podman network
# (the app targets the proxy's static internal IP 10.89.10.200).
Port 8888
Listen 0.0.0.0

# Only the internal podman subnet may use the proxy.
Allow 10.89.10.0/24

# Logging to stdout for SIEM ingestion (NIST AU). With no LogFile and Syslog
# Off, tinyproxy (run with -d) logs to stdout, which podman/journald captures.
LogLevel Info
Syslog Off

Timeout 600
MaxClients 50

# Restrict CONNECT tunneling to 443 only — no arbitrary port tunneling.
ConnectPort 443

# Default-deny domain allowlist. Only hosts matching ./filter are reachable.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterCaseSensitive Off

# Do not advertise the proxy via a Via header beyond what is needed.
DisableViaHeader Yes
