# NIST SC/IA: force TLS + SCRAM for all network access; reject cleartext.
# TYPE      DATABASE     USER         ADDRESS          METHOD
local       all          all                           scram-sha-256
# Application role: TLS-only, SCRAM, restricted to the internal podman subnet.
hostssl     vaultwarden  vaultwarden  10.89.10.0/24    scram-sha-256
# Superuser: TLS-only, for admin/backup jobs from the internal subnet.
hostssl     all          postgres     10.89.10.0/24    scram-sha-256
# Deny everything else, including any non-TLS host connection.
host        all          all          0.0.0.0/0        reject
host        all          all          ::/0             reject
